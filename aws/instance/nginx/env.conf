# __ENV__: only CloudFront (it adds the origin secret) reaches the services.
server {
    listen __PORT__;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;

    if ($http_x_eras_origin != "__SECRET__") { return 403; }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /ws {
        set $upstream http://__ENV__-drive-manager:8081;
        proxy_pass $upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location ~ ^/api/(auth|users|roles|permissions)/ {
        set $upstream http://__ENV__-users-service:8082;
        proxy_pass $upstream;
    }

    location /api/ {
        set $upstream http://__ENV__-drive-manager:8081;
        proxy_pass $upstream;
    }

    location / { return 404; }
}
