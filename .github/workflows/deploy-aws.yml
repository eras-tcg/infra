# Reusable deploy of a backend service to AWS (see aws/README.md), called by DriveManager and ErasUsersService
# with `secrets: inherit`. Runs on a GitHub runner: copies the image from GHCR to ECR, then runs eras-deploy on
# the server through SSM (starts the server if it sleeps; healthcheck and automatic rollback on the server).
# The GitHub Environment (staging/production) carries the approval rule.
name: deploy-aws

on:
  workflow_call:
    inputs:
      service:
        description: drive-manager | users-service
        required: true
        type: string
      environment:
        description: staging | production
        required: true
        type: string
      image_tag:
        description: commit sha of an image published in ghcr.io/eras-tcg/<service>
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://erastcg.com' || 'https://staging.erastcg.com' }}
    concurrency:
      group: deploy-aws-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-2
      ECR: 211078959523.dkr.ecr.us-east-2.amazonaws.com
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: eras-tcg/infra
          path: infra

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the image to ECR
        id: image
        run: |
          src=ghcr.io/eras-tcg/${{ inputs.service }}:${{ inputs.image_tag }}
          dst=$ECR/eras/${{ inputs.service }}:${{ inputs.image_tag }}
          # ECR tags are immutable: a rollback finds the image already there.
          if docker manifest inspect "$dst" >/dev/null 2>&1; then
            echo "$dst already in ECR"
          else
            docker pull "$src"
            docker tag "$src" "$dst"
            docker push "$dst"
          fi
          echo "uri=$dst" >> "$GITHUB_OUTPUT"

      - name: Deploy
        run: |
          case "${{ inputs.environment }}" in
            production) env_short=prod ;;
            *)          env_short=staging ;;
          esac
          bash infra/aws/scripts/deploy-backend.sh "$env_short" "${{ inputs.service }}" "${{ steps.image.outputs.uri }}"
