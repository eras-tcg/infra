# Reusable deploy of the Angular site to AWS (S3 + CloudFront, see aws/README.md), called by eras-web with
# `secrets: inherit` after a job of the same run uploaded the build (`ng build --configuration aws`) as an artifact.
# The GitHub Environment (production) carries the approval rule (no staging since 2026-11-26). Rollback: re-run this job in an
# earlier run (its artifact is kept 90 days).
name: deploy-site-aws

on:
  workflow_call:
    inputs:
      environment:
        description: production (the only environment)
        required: true
        type: string
      artifact:
        description: name of the artifact holding dist/eras-web/browser (and, optionally, the Android app under app/)
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: https://www.erastcg.com
    concurrency:
      group: deploy-site-aws-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: eras-tcg/infra
          path: infra

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: site

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Upload and invalidate
        run: |
          [ "${{ inputs.environment }}" = production ] || { echo "only production exists" >&2; exit 1; }
          bash infra/aws/scripts/deploy-site.sh prod site
