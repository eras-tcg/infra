# Reusable deploy job, called by each service repo's CI/CD workflow.
# Runs on the self-hosted runner in the VPS; the GitHub Environment (staging/production)
# carries the approval rule, so production waits for a reviewer before this job starts.
name: deploy

on:
  workflow_call:
    inputs:
      service:
        description: drive-manager | users-service | eras-frontend | eras-web
        required: true
        type: string
      environment:
        description: staging | production | next (eras-web only)
        required: true
        type: string
      image:
        description: full image reference to deploy
        required: true
        type: string
      nginx_vhost:
        description: path (in the caller repo) of the nginx vhost to apply, frontend only
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, eras-vps]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://erastcg.com' || inputs.environment == 'next' && 'https://next.erastcg.com' || 'https://staging.erastcg.com' }}
    concurrency:
      group: deploy-${{ inputs.service }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: eras-tcg/infra
          path: infra

      - name: Checkout service (nginx vhost)
        if: inputs.nginx_vhost != ''
        uses: actions/checkout@v4
        with:
          path: service
          sparse-checkout: ${{ inputs.nginx_vhost }}
          sparse-checkout-cone-mode: false

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        env:
          NGINX_VHOST_FILE: ${{ inputs.nginx_vhost != '' && format('{0}/service/{1}', github.workspace, inputs.nginx_vhost) || '' }}
        run: |
          case "${{ inputs.environment }}" in
            production) env_short=prod ;;
            next)       env_short=next ;;
            *)          env_short=staging ;;
          esac
          bash infra/deploy/deploy.sh "${{ inputs.service }}" "$env_short" "${{ inputs.image }}"

      - name: Logout
        if: always()
        run: docker logout ghcr.io || true
